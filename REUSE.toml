version = 1

[[annotations]]
path = ["README.md", "TRADEMARK.md", "CONTRIBUTING.md", "CHANGELOG.md", "docs/*.md", "templates/README.md", "assets/logo/PROVENANCE.md"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Open Science Stiftung (Open Science Foundation)"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
  "LICENSE",
  "NOTICE",
  "REUSE.toml",
  ".gitignore",
  ".github/CODEOWNERS",
  ".github/rulesets/*.json",
  ".github/workflows/*.yml",
  "AGENTS.md",
  "SKILL.md",
  "brand.json",
  "tokens/*.json",
  "tokens/*.css",
  "skills/*/SKILL.md",
  "scripts/*.py",
  "tests/*.py",
  "assets/logo/manifest.json"
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Open Science Stiftung (Open Science Foundation)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["assets/logo/*.svg", "assets/logo/*.png"]
precedence = "closest"
SPDX-FileCopyrightText = "Open Science Stiftung (Open Science Foundation) and respective original asset rights holders"
SPDX-License-Identifier = "LicenseRef-OSF-Brand-Assets"

[[annotations]]
path = ["web-harness/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Open Science Stiftung (Open Science Foundation)"
SPDX-License-Identifier = "Apache-2.0"

